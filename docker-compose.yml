services:
  # Grafana MCP 서버
  grafana-mcp:
    image: grafana/mcp-grafana:latest
    container_name: grafana-mcp
    hostname: grafana-mcp
    env_file:
      - .env
    # Streamable HTTP 모드로 실행 (-t streamable-http)
    command: ["-t", "streamable-http"]
    networks:
      app-network:
        aliases:
          - grafana-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # CloudWatch MCP 서버
  cloudwatch-mcp:
    image: cloudwatch-mcp-server:latest
    build:
      context: ./cloudwatch-mcp-server
    container_name: cloudwatch-mcp
    hostname: cloudwatch-mcp
    env_file:
      - .env
    environment:
      # Streamable HTTP 모드로 실행 (.env의 CLOUDWATCH_MCP_TRANSPORT로 제어)
      - CLOUDWATCH_MCP_TRANSPORT=streamable-http
      - CLOUDWATCH_MCP_HOST=cloudwatch-mcp
      - CLOUDWATCH_MCP_PORT=8000
      - AUTH_TYPE=no-auth
    volumes:
      # 멀티 프로필 지원을 위한 AWS credentials 개별 파일 마운트
      - ~/.aws/config:/app/.aws/config:ro
      - ~/.aws/credentials:/app/.aws/credentials:ro
    networks:
      app-network:
        aliases:
          - cloudwatch-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # AWS API MCP 서버
  aws-api-mcp:
    image: aws-api-mcp:latest
    build:
      context: ./aws-api-mcp-server
    container_name: aws-api-mcp
    hostname: aws-api-mcp
    env_file:
      - .env
    environment:
      # Streamable HTTP 모드로 실행
      - AWS_API_MCP_TRANSPORT=streamable-http
      - AWS_API_MCP_HOST=aws-api-mcp  # Host 헤더 검증을 위해 컨테이너 이름으로 설정
      - AWS_API_MCP_PORT=8000
      - AUTH_TYPE=no-auth
    volumes:
      # 멀티 프로필 지원을 위한 AWS credentials 개별 파일 마운트
      - ~/.aws/config:/app/.aws/config:ro
      - ~/.aws/credentials:/app/.aws/credentials:ro
    networks:
      app-network:
        aliases:
          - aws-api-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # AWS Documentation MCP 서버
  aws-docs-mcp:
    image: aws-documentation-mcp-server:latest
    build:
      context: ./aws-documentation-mcp-server
    container_name: aws-docs-mcp
    hostname: aws-docs-mcp
    env_file:
      - .env
    environment:
      # Streamable HTTP 모드로 실행
      - AWS_DOCS_MCP_TRANSPORT=streamable-http
      - AWS_DOCS_MCP_HOST=aws-docs-mcp
      - AWS_DOCS_MCP_PORT=8000
    networks:
      app-network:
        aliases:
          - aws-docs-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-agent-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-agent-backend
    hostname: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # SQLite DB 영속화
      - backend-data:/app/data
    networks:
      app-network:
        aliases:
          - backend
    restart: unless-stopped
    depends_on:
      grafana-mcp:
        condition: service_healthy
      cloudwatch-mcp:
        condition: service_healthy
      aws-api-mcp:
        condition: service_healthy
      aws-docs-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge
    # 폐쇄망 환경: 컨테이너 간 통신만 허용
    # Bedrock 접근은 호스트 네트워크를 통해 이루어짐

volumes:
  backend-data:
    driver: local
