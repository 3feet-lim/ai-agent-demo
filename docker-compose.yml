services:
  # Grafana MCP 서버
  grafana-mcp:
    image: grafana/mcp-grafana:latest
    container_name: grafana-mcp
    env_file:
      - .env
    networks:
      - app-network
    restart: unless-stopped
    # SSE 모드로 실행 (stdio가 아닌 HTTP 서버로 실행)
    # Grafana MCP는 기본적으로 SSE 모드 지원
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f mcp-grafana || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # CloudWatch MCP 서버
  cloudwatch-mcp:
    image: awslabs/cloudwatch-mcp-server:latest
    container_name: cloudwatch-mcp
    env_file:
      - .env
    environment:
      # Streamable HTTP 모드로 실행
      - AWS_API_MCP_TRANSPORT=streamable-http
      - AWS_API_MCP_HOST=0.0.0.0
      - AWS_API_MCP_PORT=8000
      - AUTH_TYPE=no-auth
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f cloudwatch-mcp-server || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # AWS API MCP 서버
  aws-api-mcp:
    image: awslabs/aws-api-mcp-server:latest
    container_name: aws-api-mcp
    env_file:
      - .env
    environment:
      # Streamable HTTP 모드로 실행
      - AWS_API_MCP_TRANSPORT=streamable-http
      - AWS_API_MCP_HOST=0.0.0.0
      - AWS_API_MCP_PORT=8000
      - AUTH_TYPE=no-auth
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f aws-api-mcp-server || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-agent-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-agent-backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # SQLite DB 영속화
      - backend-data:/app/data
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      grafana-mcp:
        condition: service_healthy
      cloudwatch-mcp:
        condition: service_healthy
      aws-api-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge
    # 폐쇄망 환경: 컨테이너 간 통신만 허용
    # Bedrock 접근은 호스트 네트워크를 통해 이루어짐

volumes:
  backend-data:
    driver: local
